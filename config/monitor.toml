[agent]
industry = "AI cho doanh nghiệp tại Việt Nam"
language = "vi"
timezone = "Asia/Ho_Chi_Minh"
report_frequency = "daily"
lookback_hours = 72
minimum_relevance = 1
max_items_per_source = 30
request_timeout_seconds = 20
workers = 6
keywords = [
  "AI agent",
  "trí tuệ nhân tạo",
  "tự động hóa",
  "AI doanh nghiệp",
  "generative AI"
]

[discovery]
# "auto" thử Brave/Google CSE khi có khóa, sau đó dùng Google News RSS miễn phí.
provider = "auto"
brave_api_key_env = "BRAVE_SEARCH_API_KEY"
google_api_key_env = "GOOGLE_SEARCH_API_KEY"
google_cx_env = "GOOGLE_SEARCH_CX"

[schedule]
enabled = false
frequency = "daily"
time = "07:30"
weekday = "MON"

[[competitors]]
name = "FPT AI"
aliases = ["FPT.AI", "FPT Smart Cloud", "FPT AI"]
urls = ["https://fpt.ai/"]

[[competitors]]
name = "Viettel AI"
aliases = ["Viettel AI", "Viettel Cyberspace Center"]
urls = ["https://viettelai.vn/"]

[[competitors]]
name = "VNPT AI"
aliases = ["VNPT AI", "VNPT-IT"]
urls = ["https://vnptai.io/"]

[[topics]]
name = "AI Agent"
keywords = ["AI agent", "tác nhân AI", "agentic AI", "multi-agent"]

[[topics]]
name = "Tự động hóa doanh nghiệp"
keywords = ["tự động hóa", "automation", "quy trình", "workflow"]

[[topics]]
name = "Mô hình và nền tảng AI"
keywords = ["mô hình AI", "LLM", "generative AI", "nền tảng AI"]

[[sources]]
id = "google-news-ai-vn"
name = "Google News - AI doanh nghiệp Việt Nam"
type = "google_news"
query = "AI doanh nghiệp Việt Nam"
priority = 1
enabled = true

