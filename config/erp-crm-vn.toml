[agent]
industry = "Phần mềm quản trị doanh nghiệp, ERP và CRM tại Việt Nam"
language = "vi"
timezone = "Asia/Ho_Chi_Minh"
report_frequency = "weekly"
lookback_hours = 720
minimum_relevance = 1
max_items_per_source = 25
request_timeout_seconds = 18
workers = 8
source_type_priority = { facebook = 1, tiktok = 1, youtube = 1, website = 3, google_news = 4 }
keywords = ["ERP", "CRM", "quản trị doanh nghiệp", "quản lý công việc", "tự động hóa", "AI", "nhân sự", "kế toán", "bán hàng", "chuyển đổi số"]

[discovery]
provider = "auto"
brave_api_key_env = "BRAVE_SEARCH_API_KEY"
google_api_key_env = "GOOGLE_SEARCH_API_KEY"
google_cx_env = "GOOGLE_SEARCH_CX"

[schedule]
enabled = true
frequency = "daily"
time = "07:30"
weekday = "MON"

[[competitors]]
name = "Base.vn"
aliases = ["Base.vn", "Base Vietnam", "Base Work"]
urls = ["https://base.vn/"]

[[competitors]]
name = "MISA AMIS"
aliases = ["MISA AMIS", "AMIS MISA", "AMIS360"]
urls = ["https://amis.misa.vn/"]

[[competitors]]
name = "1Office"
aliases = ["1Office", "1Office Next", "1AI"]
urls = ["https://1office.vn/"]

[[competitors]]
name = "ECOUNT"
aliases = ["ECOUNT ERP", "ECOUNT"]
urls = ["https://www.ecount.com/vn/"]

[[competitors]]
name = "FastWork"
aliases = ["FastWork.vn", "FastWork WORK+", "FastWork"]
urls = ["https://fastwork.vn/"]

[[competitors]]
name = "CloudGO"
aliases = ["CloudGO CRM", "CloudGO"]
urls = ["https://cloudgo.vn/"]

[[competitors]]
name = "Odoo"
aliases = ["Odoo ERP", "Odoo"]
urls = ["https://www.odoo.com/"]

[[topics]]
name = "AI và tự động hóa"
keywords = ["AI", "agent", "tự động hóa", "automation", "no-code", "low-code"]

[[topics]]
name = "CRM và bán hàng"
keywords = ["CRM", "lead", "bán hàng", "sales", "khách hàng", "omnichannel"]

[[topics]]
name = "ERP và vận hành"
keywords = ["ERP", "quản trị", "quy trình", "workflow", "dự án", "công việc", "sản xuất", "tồn kho"]

[[topics]]
name = "Nhân sự và tài chính"
keywords = ["nhân sự", "HRM", "tuyển dụng", "chấm công", "tiền lương", "kế toán", "thuế", "hóa đơn"]

[[topics]]
name = "Triển khai và hiệu quả"
keywords = ["triển khai", "chi phí", "ROI", "case study", "khách hàng", "bảo mật", "tích hợp"]

